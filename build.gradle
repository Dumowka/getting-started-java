plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.18.2",
            "org.junit.jupiter:junit-jupiter:6.1.3")
    testImplementation platform("io.qameta.allure:allure-bom:3.0.0")
    testImplementation(
            "io.qameta.allure:allure-jupiter",
            "io.qameta.allure:allure-selenide")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    agent "org.aspectj:aspectjweaver:1.9.25.1"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()

    jvmArgs "-javaagent:${configurations.agent.singleFile}"

    def allureResultsDir = layout.buildDirectory.dir("allure-results")
    doFirst {
        delete allureResultsDir
    }

    ['selenide.baseUrl', 'selenide.browser', 'selenide.browserSize', 'selenide.headless', 'selenide.remote'].each { key ->
        def value = providers.systemProperty(key)
        if (value.present) {
            systemProperty key, value.get()
        }
    }
}
